<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Emerald Flow Gradient -->
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Amber Loop Accent Gradient -->
    <linearGradient id="flowGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring Glow -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#334155" stroke-width="3" opacity="0.6"/>

  <!-- Icon Mark: The K-Flow -->
  <g transform="translate(116, 106)">
    <!-- Vertical Pillar (The Spine of Commerce / Trust) -->
    <rect x="20" y="20" width="44" height="260" rx="22" fill="#F8FAFC" />

    <!-- Top Flow Branch (Connected / Forward Loop) -->
    <path d="M 64 150 C 90 150, 140 100, 180 50 C 205 20, 245 35, 235 70 C 220 120, 160 170, 110 180 Z" 
          fill="url(#flowGrad1)" />

    <!-- Bottom Flow Branch (Circulation / Handshake Loop) -->
    <path d="M 100 160 C 145 175, 200 215, 225 255 C 240 280, 205 310, 175 290 C 135 260, 90 200, 64 185 Z" 
          fill="url(#flowGrad2)" />

    <!-- Center Interlocking Node (The Cash / Handshake Point) -->
    <circle cx="120" cy="170" r="22" fill="#10B981" stroke="#0F172A" stroke-width="8" />
  </g>
</svg>
