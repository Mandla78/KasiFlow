<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Mark Box -->
    <linearGradient id="akayzaMarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Emerald Flow Gradient -->
    <linearGradient id="akayzaLogoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Amber Flow Gradient -->
    <linearGradient id="akayzaLogoAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <!-- Centered Logo Mark Container -->
  <g transform="translate(100, 30)">
    <!-- Base Squircle -->
    <rect width="200" height="200" rx="44" fill="url(#akayzaMarkBg)" />

    <!-- Subtle Inner Border -->
    <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />

    <!-- Scaled A-Flow Emblem -->
    <g transform="translate(44, 41) scale(0.39)">
      <!-- Left Main Pillar -->
      <rect x="20" y="20" width="44" height="260" rx="22" fill="#FFFFFF" />

      <!-- Top Loop Branch -->
      <path d="M 64 150 C 95 145, 140 95, 180 50 C 208 18, 246 35, 235 70 C 220 120, 160 170, 110 180 Z" 
            fill="url(#akayzaLogoEmerald)" />

      <!-- Bottom Returning Loop Branch -->
      <path d="M 100 160 C 145 175, 200 215, 225 255 C 240 280, 205 310, 175 290 C 135 260, 90 200, 64 185 Z" 
            fill="url(#akayzaLogoAmber)" />

      <!-- Center Interlock Handshake Node -->
      <circle cx="120" cy="170" r="22" fill="#10B981" stroke="#0F172A" stroke-width="8" />
    </g>
  </g>

  <!-- Wordmark: akayza Centered Below -->
  <text x="200" y="305" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="-1.5" 
        fill="#0F172A">
    akay<tspan fill="#10B981">za</tspan>
  </text>
</svg>
