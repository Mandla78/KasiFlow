# Every pull request and every push to main: the whole backend suite on a
# real PostgreSQL, the app's type check and tests, a dependency audit and a
# secrets scan. The same checks we run by hand before a merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: akayza
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: akayza_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akayza"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Made-up values for CI only; no real secret is used or needed.
      POSTGRES_USER: akayza
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_DB: akayza_dev
      POSTGRES_TEST_DB: akayza_test
      MAIL_PROVIDER: fake
      SECRET_KEY: ci-only-secret-key-used-nowhere-else-000000
      JWT_SECRET_KEY: ci-only-jwt-secret-key-used-nowhere-else-00
      TZ: Africa/Johannesburg
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -p no:warnings tests

  app:
    name: App (tsc + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - run: npm ci
      # Expo writes this file on first start; it's gitignored.
      - run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npx jest --silent

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # What ships in the app: fail on high or critical only (see
      # docs/teammate/feedback/FINDING_dependency_audit.txt for the moderates).
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend/mobile

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
